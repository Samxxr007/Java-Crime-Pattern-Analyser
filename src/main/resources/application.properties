# ============================================================
# Chennai Crime Pattern Analyzer
# Application Configuration
# ============================================================

spring.application.name=Chennai Crime Pattern Analyzer

# -------------------------------------------------------
# Server
# -------------------------------------------------------
server.port=${SERVER_PORT:8085}
server.error.include-message=never
server.error.include-stacktrace=never

# -------------------------------------------------------
# Database Configuration
# Default: In-Memory H2 (zero setup needed)
# To use MySQL: Set DB_URL, DB_USERNAME, DB_PASSWORD environment variables or properties
# -------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:crime_analyzer;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# -------------------------------------------------------
# JPA / Hibernate
# -------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# -------------------------------------------------------
# Thymeleaf
# -------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# -------------------------------------------------------
# Dataset
# -------------------------------------------------------
app.dataset.path=dataset/chennai_crime_synthetic.csv
app.dataset.auto-generate=true
app.dataset.auto-import=true
app.dataset.record-count=3000

# -------------------------------------------------------
# Logging
# -------------------------------------------------------
logging.level.com.crimeanalyzer=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss} [%level] %logger{36} - %msg%n
