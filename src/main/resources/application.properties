# ============================================================
# Chennai Crime Pattern Analyzer
# Application Configuration
# ============================================================

spring.application.name=Chennai Crime Pattern Analyzer

# -------------------------------------------------------
# Server
# -------------------------------------------------------
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

# -------------------------------------------------------
# Database — override with environment variables in prod
# -------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crime_analyzer?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# -------------------------------------------------------
# JPA / Hibernate
# -------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------
# Thymeleaf
# -------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# -------------------------------------------------------
# Dataset
# -------------------------------------------------------
app.dataset.path=dataset/chennai_crime_synthetic.csv
app.dataset.auto-generate=true
app.dataset.auto-import=true
app.dataset.record-count=3000

# -------------------------------------------------------
# Logging
# -------------------------------------------------------
logging.level.com.crimeanalyzer=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss} [%level] %logger{36} - %msg%n
